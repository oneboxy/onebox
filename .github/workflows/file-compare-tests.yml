name: OneBox app checks

on:
  push:
    branches: [feature/file-comparison]
    paths:
      - 'dist/app.js'
      - 'dist/file-compare-*.js'
      - 'dist/ticket-wallet-layout.js'
      - 'dist/style.css'
      - 'dist/vendor/**'
      - 'tests/*.test.cjs'
      - '.github/workflows/file-compare-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dist/app.js'
      - 'dist/file-compare-*.js'
      - 'dist/ticket-wallet-layout.js'
      - 'dist/style.css'
      - 'dist/vendor/**'
      - 'tests/*.test.cjs'
      - '.github/workflows/file-compare-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/file-compare-core.js
          node --check dist/file-compare-ui.js
          node --check dist/file-compare-worker.js
          node --check dist/ticket-wallet-layout.js
      - name: Run file comparison tests
        run: node --test tests/*.test.cjs
