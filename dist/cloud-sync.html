<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb">
  <meta name="description" content="管理 OneBox 个人 GitHub Gist 同步">
  <title>OneBox GitHub 同步</title>
  <link rel="stylesheet" href="cloud-sync.css">
</head>
<body>
  <main class="cloud-page">
    <header><a href="./#mine" aria-label="返回 OneBox">‹</a><span>OneBox GitHub 同步</span><small>个人 Gist 存储</small></header>
    <section class="cloud-card">
      <div class="cloud-mark">◈</div>
      <h1>数据保存在你的 GitHub Gist</h1>
      <p class="intro">你选择同步的设置、导航、日程、消息、阅读数据、书籍原件和卡包附件保存在你自己的秘密 Gist。OneBox 不把这些数据写入 Cloudflare。</p>
      <div id="cloudStatus" class="status-line">正在读取本机 GitHub 连接…</div>
      <label class="consent auto-sync"><input id="autoSync" type="checkbox"><span>联网时自动同步到这个 GitHub 账号；关闭后保留现有 Gist 备份。</span></label>
      <div class="gist-note"><strong>关于秘密 Gist</strong><span>秘密 Gist 不会公开列在个人主页上，但不是私有仓库。任何拿到 Gist 链接的人都可能读取内容，请勿同步敏感文件。</span></div>
      <a class="primary link-button" href="./#mine">返回 OneBox 账号设置</a>
      <p class="privacy-note">每个 GitHub 账号管理自己的 Gist。当前模式不支持后台跨用户查看、编辑或删除个人数据。</p>
    </section>
  </main>
  <script src="cloud-migration.js" defer></script>
</body>
</html>
