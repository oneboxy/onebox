  <script>
    // Keep the requested site path and only advance legacy icon-test URLs.
    const favoriteUrl = new URL(location.href);
    let favoriteUrlChanged = false;
    const favoriteIconVersion = favoriteUrl.searchParams.get('favorite-icon');
    if (/^\d+\.\d+\.\d+$/.test(favoriteIconVersion || '')) {
      const requestedParts = favoriteIconVersion.split('.').map(Number);
      const currentParts = [2, 18, 337];
      const isOlderVersion = requestedParts.some((part, index) => {
        if (part === currentParts[index]) return false;
        return part < currentParts[index] && requestedParts.slice(0, index).every((prior, priorIndex) => prior === currentParts[priorIndex]);
      });
      if (isOlderVersion) {
        favoriteUrl.searchParams.set('favorite-icon', '2.18.359');
        favoriteUrlChanged = true;
      }
    }
    if (favoriteUrlChanged) location.replace(favoriteUrl.pathname + favoriteUrl.search + favoriteUrl.hash);
  </script>
