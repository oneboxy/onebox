name = "onebox"
main = "src/index.js"
compatibility_date = "2026-10-08"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "onebox-reader-sync"
database_id = "6467f2e8-3711-4b9d-93c0-34a82c6db75b"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "USER_FILES_BUCKET"
bucket_name = "onebox-user-files"

[vars]
ALLOWED_ORIGIN = "https://oneboxy.github.io"
BOOTSTRAP_SUPERADMIN_GITHUB_IDS = "9962337"

[triggers]
crons = ["15 * * * *"]
